name: Set up pinned Noma workspace
description: Install the exact Node and pnpm toolchain, restore only the pnpm store, and perform a frozen install.

runs:
  using: composite
  steps:
    - name: Set up Node 24.18.0
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        check-latest: false

    - name: Set up pnpm 11.17.0
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 11.17.0
        run_install: false

    - name: Verify and report toolchain
      shell: bash
      run: |
        test "$(node --version)" = "v24.18.0"
        test "$(pnpm --version)" = "11.17.0"
        node --version
        pnpm --version
        git --version
        if command -v docker >/dev/null 2>&1; then
          docker --version
          docker compose version || true
        fi

    - name: Resolve pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm content-addressable store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-node-24.18.0-pnpm-11.17.0-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ runner.arch }}-node-24.18.0-pnpm-11.17.0-

    - name: Install frozen workspace
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Reject dependency metadata mutation
      shell: bash
      run: git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml package.json

