packages:
  - apps/*
  - packages/*
overrides:
  'fast-uri@': 3.1.7
  mysql2: 3.23.1
  multer: 2.3.0
  'nanoid@': 3.3.18
  qs: 6.16.0
  sharp: 0.35.4
  deepmerge-ts: 8.0.2
verifyDepsBeforeRun: false
peerDependencyRules:
  allowedVersions:
    'tsconfck@3.1.6>typescript': 6.0.3
allowBuilds:
  '@prisma/engines': true
  argon2: true
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false
minimumReleaseAgeExclude:
  - deepmerge-ts@8.0.2
  - '@aws-sdk/client-kms@3.1131.0'
